<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chas – World Time</title>
    <meta name="description" content="Chas is a compact world clock for your Mac." />
    <link rel="icon" href="src/AppIcon.webp" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page" aria-labelledby="app-title">
      <header class="brand" aria-label="Chas">
        <img class="brand__icon" src="src/AppIcon.webp" alt="" width="50" height="50" />
        <h1 id="app-title" class="brand__name">Chas</h1>
      </header>

      <section class="content" aria-label="About Chas">
        <figure class="feature">
          <figcaption class="copy">See the local time in any city worldwide</figcaption>
          <img
            class="feature__image"
            src="src/Slide-1_2x.webp"
            alt="Chas window with the local time in six cities"
            width="547"
            height="650"
          />
        </figure>

        <figure class="feature">
          <figcaption class="copy">Convert time across time zones instantly</figcaption>
          <img
            class="feature__image"
            src="src/Slide-2_2x.webp"
            alt="Entering a time in one city converts it for all other cities"
            width="1062"
            height="650"
          />
        </figure>

        <figure class="feature">
          <figcaption class="copy">Personalize your clocks with custom names and a home city</figcaption>
          <img
            class="feature__image"
            src="src/Slide-3_2x.webp"
            alt="Clocks with custom names like Work and Mom"
            width="547"
            height="650"
          />
        </figure>
      </section>

      <footer class="links">
        <a href="user-guide.html">User Guide</a>
        <a href="mailto:alxndr.bokhan@gmail.com">Support</a>
        <a href="privacy-policy.html">Privacy Policy</a>
      </footer>
    </main>
  </body>
</html>
